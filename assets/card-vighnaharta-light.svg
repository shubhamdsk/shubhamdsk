<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Vighnaharta Traders: Counter bills, live stock, udhari and Marathi bills sent on WhatsApp.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f4f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#be123c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .float { animation: float 6s ease-in-out infinite alternate; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .grow, .pulse, .float { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#dots)"/>
    <circle class="float" cx="500" cy="60" r="190" fill="url(#glow)"/>
    <rect width="600" height="3" fill="url(#edge)"/>
    <g class="fade d1">
      <circle class="pulse" cx="42" cy="47" r="4.5" fill="#be123c"/>
      <text class="mono" x="54" y="52" font-size="12.5" letter-spacing="1.5" fill="#be123c">CLIENT &#183; SHOWCASE</text>
    </g>
    <text class="fade d1" x="34" y="100" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.6">Vighnaharta Traders</text>
    <text class="fade d2" x="36" y="136" font-size="16" fill="#475569">Counter bills, live stock, udhari and</text>
    <text class="fade d2" x="36" y="160" font-size="16" fill="#475569">Marathi bills sent on WhatsApp.</text>
    <g class="fade d3">
      <rect x="36" y="240" width="69" height="26" rx="13" fill="#be123c" fill-opacity="0.08" stroke="#be123c" stroke-opacity="0.35"/><text class="mono" x="44" y="257.5" font-size="12.5" fill="#1e293b">Next.js</text>
      <rect x="113.2" y="240" width="92" height="26" rx="13" fill="#be123c" fill-opacity="0.08" stroke="#be123c" stroke-opacity="0.35"/><text class="mono" x="121.2" y="257.5" font-size="12.5" fill="#1e293b">TypeScript</text>
      <rect x="213.2" y="240" width="46" height="26" rx="13" fill="#be123c" fill-opacity="0.08" stroke="#be123c" stroke-opacity="0.35"/><text class="mono" x="221.2" y="257.5" font-size="12.5" fill="#1e293b">Neon</text>
      <rect x="267.6" y="240" width="62" height="26" rx="13" fill="#be123c" fill-opacity="0.08" stroke="#be123c" stroke-opacity="0.35"/><text class="mono" x="275.6" y="257.5" font-size="12.5" fill="#1e293b">Vercel</text>
    </g>
    <g class="fade d2">
      <g transform="translate(418 50)">
        <rect width="150" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
        <text class="mono" x="14" y="26" font-size="11" fill="#64748b">UDHARI</text>
        <text x="14" y="50" font-size="20" font-weight="700" fill="#be123c">&#8377;52,445</text>
        <line x1="14" y1="116" x2="136" y2="116" stroke="#e2e8f0"/>
        <rect class="grow" style="animation-delay:.2s" x="18" y="86" width="16" height="30" rx="3" fill="#be123c"/>
        <rect class="grow" style="animation-delay:.35s" x="42" y="72" width="16" height="44" rx="3" fill="#be123c"/>
        <rect class="grow" style="animation-delay:.5s" x="66" y="92" width="16" height="24" rx="3" fill="#be123c" fill-opacity="0.6"/>
        <rect class="grow" style="animation-delay:.65s" x="90" y="64" width="16" height="52" rx="3" fill="#34d399"/>
        <rect class="grow" style="animation-delay:.8s" x="114" y="78" width="16" height="38" rx="3" fill="#be123c"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="299" rx="22" fill="none" stroke="#e2e8f0"/>
</svg>
