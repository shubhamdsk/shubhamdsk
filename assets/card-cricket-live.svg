<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Cricket Live: Real-time scores and commentary streamed over Server-Sent Events.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#101829"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="300" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .fade { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.5s; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .float { animation: float 6s ease-in-out infinite alternate; }
    .dash { stroke-dasharray: 6 6; animation: flow 1.4s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes float { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes ring { from { transform: scale(0.6); opacity: 0.8; } to { transform: scale(2.4); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .grow, .pulse, .float, .dash, .ring, .spin { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#dots)"/>
    <circle class="float" cx="500" cy="60" r="190" fill="url(#glow)"/>
    <rect width="600" height="3" fill="url(#edge)"/>
    <g class="fade d1">
      <circle class="pulse" cx="42" cy="47" r="4.5" fill="#ef4444"/>
      <text class="mono" x="54" y="52" font-size="12.5" letter-spacing="1.5" fill="#ef4444">OPEN SOURCE &#183; LIVE</text>
    </g>
    <text class="fade d1" x="34" y="100" font-size="31" font-weight="700" fill="#f8fafc" letter-spacing="-0.6">Cricket Live</text>
    <text class="fade d2" x="36" y="136" font-size="16" fill="#a8b3c7">Real-time scores and commentary</text>
    <text class="fade d2" x="36" y="160" font-size="16" fill="#a8b3c7">streamed over Server-Sent Events.</text>
    <g class="fade d3">
    <rect x="36" y="240" width="54" height="26" rx="13" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/><text class="mono" x="44" y="257.5" font-size="12.5" fill="#e2e8f0">React</text>
    <rect x="98.0" y="240" width="107" height="26" rx="13" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/><text class="mono" x="106.0" y="257.5" font-size="12.5" fill="#e2e8f0">ASP.NET Core</text>
    <rect x="213.2" y="240" width="54" height="26" rx="13" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.35"/><text class="mono" x="221.2" y="257.5" font-size="12.5" fill="#e2e8f0">Redis</text>
    </g>
    <g class="fade d2">
    <g transform="translate(414 52)">
      <rect width="156" height="128" rx="14" fill="#0f172a" stroke="#334155"/>
      <circle class="ring" cx="22" cy="22" r="6" fill="#ef4444"/>
      <circle cx="22" cy="22" r="5" fill="#ef4444"/>
      <text class="mono" x="34" y="26" font-size="11" font-weight="700" fill="#fca5a5">LIVE</text>
      <text x="14" y="62" font-size="24" font-weight="700" fill="#f8fafc">182/4</text>
      <text class="mono" x="14" y="82" font-size="11" fill="#94a3b8">18.2 ov &#183; RR 9.9</text>
      <path class="dash" d="M14 108 C 44 92, 64 120, 94 102 S 134 96, 144 104" fill="none" stroke="#34d399" stroke-width="2"/>
    </g></g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="299" rx="22" fill="none" stroke="#1f2a40"/>
</svg>
