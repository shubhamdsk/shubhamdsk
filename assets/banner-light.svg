<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shubham Deshmukh, software engineer at Hare and Turtle AI Solutions working on MSIG USA, and founder of Nexora Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#94a3b8" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 2.4s ease-out 0.3s forwards; }
    .fade { opacity: 0; animation: fade 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-120px, 30px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(90px, -25px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .orb, .orb2, .pulse, .caret { animation: none; }
      .line { animation: none; stroke-dashoffset: 0; }
      .fade { animation: none; opacity: 1; }
    }
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="orb" cx="980" cy="70" r="260" fill="url(#glow)"/>
    <circle class="orb2" cx="760" cy="330" r="220" fill="url(#glow2)"/>

    <g class="fade d1">
      <rect x="64" y="52" width="196" height="30" rx="15" fill="#ffffff" stroke="#dbe3f0"/>
      <circle class="pulse" cx="84" cy="67" r="5" fill="#34d399"/>
      <text x="98" y="72" font-size="14" font-weight="600" fill="#334155">Open to collaboration</text>
    </g>

    <text class="fade d2" x="62" y="148" font-size="60" font-weight="700" fill="#0f172a" letter-spacing="-1.5">Shubham Deshmukh</text>
    <path class="line" d="M64 170 H584" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <text class="fade d3" x="64" y="212" font-size="20" font-weight="500" fill="#334155">Software Engineer, <tspan fill="#0f172a" font-weight="700">Hare and Turtle AI Solutions</tspan> &#183; Founder, <tspan fill="#0f172a" font-weight="700">Nexora Studio</tspan></text>

    <g class="fade d4">
      <text class="mono" x="64" y="262" font-size="16" fill="#64748b">$ <tspan fill="#2563eb">ship</tspan> <tspan fill="#7c3aed">--angular --react --next</tspan> <tspan fill="#059669">--dotnet --postgres</tspan></text>
      <rect class="caret" x="560" y="249" width="9" height="17" fill="#2563eb"/>
    </g>

    <g transform="translate(860 79)">
      <g class="fade d3">
        <rect width="280" height="182" rx="18" fill="#ffffff" fill-opacity="0.85" stroke="#dbe3f0"/>
        <circle cx="22" cy="22" r="5" fill="#f87171"/><circle cx="40" cy="22" r="5" fill="#fbbf24"/><circle cx="58" cy="22" r="5" fill="#34d399"/>
        <text class="mono" x="22" y="62" font-size="14" fill="#64748b">based</text>
        <text class="mono" x="96" y="62" font-size="14" fill="#0f172a">Pune, India</text>
        <text class="mono" x="22" y="88" font-size="14" fill="#64748b">works</text>
        <text class="mono" x="96" y="88" font-size="14" fill="#0f172a">Hare and Turtle AI</text>
        <text class="mono" x="22" y="114" font-size="14" fill="#64748b">client</text>
        <text class="mono" x="96" y="114" font-size="14" fill="#0f172a">MSIG USA &#183; LOBs</text>
        <text class="mono" x="22" y="140" font-size="14" fill="#64748b">studio</text>
        <text class="mono" x="96" y="140" font-size="14" fill="#0f172a">Nexora Studio</text>
        <text class="mono" x="22" y="166" font-size="14" fill="#64748b">status</text>
        <circle class="pulse" cx="101" cy="161" r="4" fill="#34d399"/>
        <text class="mono" x="112" y="166" font-size="14" fill="#059669">building</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#e2e8f0"/>
</svg>
